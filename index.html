<!doctype html>

    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app draw under phone notches/gesture bars;
         css/pwa.css keeps content clear of them with safe-area insets. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />


    <!-- THEME BOOTSTRAP (inline on purpose): sets light/dark BEFORE the first
         paint so a dark-mode user never sees a white flash. js/theme.js takes
         over once loaded. -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem("qa-theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>

    <!--
      INSTALL-PROMPT CATCHER (inline on purpose)
      Chrome fires "beforeinstallprompt" once, whenever it likes -- on a
      slow connection that can be before js/installPrompt.js has even
      downloaded, and an event nobody was listening for is lost. This
      parks it on window; installPrompt.js picks it up from there.
    -->
    <script>
      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        window.__qaDeferredPrompt = e;
        window.dispatchEvent(new Event("qa:bip"));
      });
      window.addEventListener("appinstalled", function () {
        window.__qaInstalled = true;
        window.__qaDeferredPrompt = null;
        window.dispatchEvent(new Event("qa:installed"));
      });
    </script>

    <!-- DESKTOP MODE: re-applies the student's saved "Desktop mode" choice
         before first paint (logic mirrors js/utils/desktopMode.js). -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("qa-desktop-mode") !== "1") return;
          var m = document.querySelector('meta[name="viewport"]');
          if (!m) return;
          var fit = Math.min(1, (window.innerWidth || screen.width || 390) / 1100);
          m.setAttribute(
            "content",
            "width=1100, initial-scale=" + fit.toFixed(3) +
              ", minimum-scale=" + Math.min(fit, 0.25).toFixed(3) +
              ", maximum-scale=5, user-scalable=yes, viewport-fit=cover"
          );
          document.documentElement.className += " qa-desktop-mode";
        } catch (e) {}
      })();
    </script>

    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png?v=3" />

    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=3" />

    <!-- FONT: Lexend (see css/theme.css for why). preconnect saves ~100-300ms
         on mobile data; display=swap shows text immediately in the fallback. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap"
    />

    <!--
      BOOT LOADER (critical, inline)
      ------------------------------
      Deliberately inline and dependency-free — no external CSS,
      no JS module — so it paints instantly, before Firebase Auth
      has even started resolving whether someone is signed in.
      Without this, a returning signed-in student stared at a
      blank white #app for as long as auth + the Firestore user
      lookup took (sometimes several seconds on a slow connection).
      js/main.js removes it once the real page has rendered.
    -->
    <style>
      :root { --bl-bg: #f2faf9; --bl-ink: #082322; }
      :root[data-theme="dark"] { --bl-bg: #061616; --bl-ink: #f3fbfa; }
      #bootLoader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: var(--bl-bg, #f2faf9);
        transition: opacity 0.3s ease;
      }
      #bootLoader.boot-loader-hide {
        opacity: 0;
        pointer-events: none;
      }
      .boot-loader-logo {
        font-family: Lexend, system-ui, sans-serif;
        font-weight: 800;
        font-size: 22px;
        letter-spacing: -0.02em;
        color: var(--bl-ink, #082322);
      }
      .boot-loader-spinner-wrap {
        position: relative;
        width: 44px;
        height: 62px;
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }
      .boot-loader-spinner {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: linear-gradient(135deg, #27807f, #5ec4c1);
        box-shadow: 0 10px 24px rgba(56, 150, 149, 0.35);
        animation: boot-loader-bounce 0.9s cubic-bezier(0.68, -0.55, 0.27, 1.55)
          infinite;
      }
      .boot-loader-shadow {
        position: absolute;
        bottom: 0;
        width: 28px;
        height: 7px;
        border-radius: 50%;
        background: rgba(56, 150, 149, 0.18);
        animation: boot-loader-shadow-pulse 0.9s
          cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
      }
      @keyframes boot-loader-bounce {
        0%,
        100% {
          transform: scale(1, 1) translateY(0);
        }
        20% {
          transform: scale(1.15, 0.8) translateY(0);
        }
        45% {
          transform: scale(0.85, 1.2) translateY(-18px);
        }
        65% {
          transform: scale(1.08, 0.92) translateY(0);
        }
        80% {
          transform: scale(0.96, 1.04) translateY(-5px);
        }
      }
      @keyframes boot-loader-shadow-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.7;
        }
        45% {
          transform: scale(0.55);
          opacity: 0.35;
        }
        65% {
          transform: scale(0.9);
          opacity: 0.6;
        }
      }
    </style>
